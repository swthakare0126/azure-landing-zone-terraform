name: Terraform CI-CD

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:

  # ==========================================================
  # 1. FEATURE BRANCH
  #    Terraform Plan + Automatic PR
  # ==========================================================

  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'push' && startsWith(github.ref_name, 'feature/')
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan

  # ==========================================================
  # 2. AUTOMATICALLY CREATE PR
  # ==========================================================

  create-pr:
    name: Create Pull Request
    needs: terraform-plan
    if: success()
    runs-on: ubuntu-latest

    steps:

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |

          EXISTING_PR=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then

            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "Terraform Change - ${{ github.ref_name }}" \
              --body "## Terraform Change

          Feature branch: \`${{ github.ref_name }}\`

          Terraform checks completed successfully:

          - Terraform Format
          - Terraform Init
          - Terraform Validate
          - Terraform Plan

          Please review and approve this Pull Request."

          else

            echo "Pull Request already exists: #$EXISTING_PR"

          fi

  # ==========================================================
  # 3. AFTER PR IS MERGED TO MAIN
  #    RUN TERRAFORM PLAN AGAIN
  # ==========================================================

  terraform-plan-after-merge:
    name: Terraform Plan After Merge
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-after-merge
          path: terraform/tfplan


  # ==========================================================
  # 4. MANUAL APPROVAL + TERRAFORM APPLY
  # ==========================================================

  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan-after-merge

    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    # IMPORTANT:
    # GitHub Repository Settings
    # -> Environments
    # -> production
    # -> Required reviewers
    environment:
      name: production

    concurrency:
      group: terraform-production
      cancel-in-progress: false

    steps:

      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve tfplan
